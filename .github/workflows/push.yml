on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.100'
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        run: dotnet build src/UnionStruct.slnx -c Release
      - name: Test
        run: |
          cd src/
          dotnet test --solution UnionStruct.slnx -c Release --no-build
          dotnet pack -c Release -o ./artifacts -p:Version=0.0.0-temp
          dotnet restore UnionStruct.Tests.NuGetIntegration/UnionStruct.Tests.NuGetIntegration.csproj --packages ./packages --configfile "nuget.integration-tests.config"
          dotnet build UnionStruct.Tests.NuGetIntegration/UnionStruct.Tests.NuGetIntegration.csproj -c Release --packages ./packages --no-restore
          dotnet test --project UnionStruct.Tests.NuGetIntegration/UnionStruct.Tests.NuGetIntegration.csproj -c Release --no-build --no-restore
      - name: Pack
        run: |
          cd src/
          dotnet pack -c Release -o .
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet
        run: |
          cd src/
          dotnet nuget push *.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --no-symbols \
            --skip-duplicate
